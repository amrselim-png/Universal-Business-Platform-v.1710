name: CI

on:
  push:
    branches:
      - main
      - master
      - 'cline/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: فحص الأنواع + الاختبارات + البناء
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check (tsc --noEmit)
        run: bun run lint

      - name: Unit tests (vitest)
        run: bun run test

      - name: Production build
        run: bun run build

      # ميزانية حجم الحزمة: حزمة الإقلاع ≤ 160KB gzip، الـ CSS ≤ 30KB،
      # أكبر حزمة مؤجّلة ≤ 160KB، الإجمالي ≤ 1200KB. تحتاج dist/ بعد البناء.
      - name: Bundle speed budget (gzip)
        run: node scripts/check-bundle-budget.mjs

  server:
    name: فحص واختبار الـ API (أمان + صلاحيات)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # اختبارات الأمان: المصادقة + عزل المستأجرين + فرض الصلاحيات.
      # تعمل بلا قاعدة بيانات (طبقة الوصول تُستبدل بدوال وهمية).
      - name: Server type check
        run: bunx tsc --noEmit

      - name: Server security tests
        run: bun run test

  guardrails:
    name: بوابات الجودة المعمارية
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # يمنع تكرار ملف بحجم PlatformContext.tsx (12,000+ سطر).
      # يسمح بالوضع الحالي لكن يفشل على أي ملف جديد أو أي ملف يكبر أكثر.
      - name: Enforce file-size ratchet (300-line limit)
        run: node scripts/check-file-size.mjs

      # بوابات المعمارية الجديدة: نطاق المحرك (حد 300 سطر) + سجل الأفعال
      # (Default-Deny) + الثوابت المعمارية (RLS/version/NOTIFY/SignalR/YARP).
      # يفشل أيضاً إذا كانت لقطة القياس `guardrailsSnapshot.ts` قديمة.
      - name: Architecture guardrails (engine + actions + invariants)
        run: node scripts/architecture-guardrails.mjs --check

      # مقياس موارد الشاشات (أسطر/خطافات/مكتبات ثقيلة) — يفشل إذا كان الملف المولَّد قديماً
      - name: Screen resource metrics (static scan)
        run: node scripts/screen-metrics.mjs --check

      # تجميد PlatformContext: ممنوع إضافة dataset جديد إلى حِزمة الإقلاع
      - name: Context dataset freeze (no new datasets)
        run: node scripts/check-context-freeze.mjs
