name: CI

on:
  push:
    branches:
      - main
      - master
      - 'cline/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: فحص الأنواع + الاختبارات + البناء
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check (tsc --noEmit)
        run: bun run lint

      - name: Unit tests (vitest)
        run: bun run test

      - name: Production build
        run: bun run build

  guardrails:
    name: بوابات الجودة المعمارية
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # يمنع تكرار ملف بحجم PlatformContext.tsx (12,000+ سطر).
      # يسمح بالوضع الحالي لكن يفشل على أي ملف جديد أو أي ملف يكبر أكثر.
      - name: Enforce file-size ratchet (300-line limit)
        run: node scripts/check-file-size.mjs
